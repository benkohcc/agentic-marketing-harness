<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1400" height="380" fill="#ffffff"/>
<text x="40" y="44" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B1B1F" text-anchor="start">Three kinds of green: code has a compiler, a campaign answers in two weeks — so every check says which kind it is</text>
<rect x="40" y="80" width="425" height="200" rx="10" fill="#fff" stroke="#1B1B1F" stroke-width="2"/>
<text x="56" y="110" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B1B1F" text-anchor="start">Deterministic</text>
<text x="56" y="138" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">true or false, instant, free to rerun</text>
<text x="56" y="155" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">hooks · copy-lint · run-fixtures:</text>
<text x="56" y="172" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">audience rules, disjointness, size share,</text>
<text x="56" y="189" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">journey structure, traces, 2,000-run fuzz,</text>
<text x="56" y="206" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">links, UTMs, caps, suppression, PII, window</text>
<text x="56" y="223" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start"></text>
<text x="56" y="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">they BLOCK</text>
<rect x="485" y="80" width="425" height="200" rx="10" fill="#fff" stroke="#8a8378" stroke-width="2"/>
<text x="501" y="110" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B1B1F" text-anchor="start">Rubric</text>
<text x="501" y="138" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">an LLM judge against criteria written first,</text>
<text x="501" y="155" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">fresh context, structured verdict</text>
<text x="501" y="172" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">10 narrow validators + 2 reviewers,</text>
<text x="501" y="189" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">calibrated against outcomes in</text>
<text x="501" y="206" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">evals/calibration.jsonl</text>
<text x="501" y="223" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start"></text>
<text x="501" y="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">block below a threshold, otherwise FLAG</text>
<rect x="930" y="80" width="425" height="200" rx="10" fill="#fff" stroke="#B0ADA6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="946" y="110" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B1B1F" text-anchor="start">Outcome</text>
<text x="946" y="138" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">the real test, which arrives late</text>
<text x="946" y="155" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">/measure against criteria.md thresholds,</text>
<text x="946" y="172" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">never post-hoc metrics</text>
<text x="946" y="189" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">feeds retros → instincts → rules/learned/</text>
<text x="946" y="206" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">and the validator weights</text>
<text x="946" y="223" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start"></text>
<text x="946" y="240" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1B1B1F" text-anchor="start">never the gate for the campaign it measures</text>
<text x="700" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A60" text-anchor="middle">Compiler-shaped work moves left over time: the test-writer spends judgment once on fixtures.yaml; a script runs it forever.</text>
<text x="700" y="340" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A60" text-anchor="middle">What stays right is exactly what should: whether the creative was good, and whether the hypothesis was true.</text>
<text x="700" y="364" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B1B1F" text-anchor="middle">Anyone selling a marketing agent with a single “verified ✓” is collapsing these three, and the collapse is where the trust leaks out.</text>
</svg>
